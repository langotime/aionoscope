[project]
name = "toyts"
version = "0.1.0"
description = "PyTorch-native synthetic time series dataset generator."
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "torch>=2.1",
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["toyts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
